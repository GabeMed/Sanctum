# Local development stack: Postgres + Sanctum.
# Requires SANCTUM_KEK and SANCTUM_API_TOKEN in the environment (see README, `make keys`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanctum
      POSTGRES_PASSWORD: sanctum # local development only
      POSTGRES_DB: sanctum
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanctum -d sanctum"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sanctum:sanctum@db:5432/sanctum?sslmode=disable
      SANCTUM_KEK: ${SANCTUM_KEK:?SANCTUM_KEK is not set, run make keys}
      SANCTUM_API_TOKEN: ${SANCTUM_API_TOKEN:?SANCTUM_API_TOKEN is not set, run make keys}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
